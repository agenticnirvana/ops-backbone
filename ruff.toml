# Ruff 0.16 expanded defaults from ~59 rules to 413. Pin an explicit set so CI
# stays a real gate (unused imports, syntax, isort) without failing on
# intentional fail-soft `except Exception` in tracing / policy / RAG.

target-version = "py311"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["agent", "api", "evals", "notifications", "observability", "rag"]
