[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/agentops/*.jsonl,/var/log/agentops/*.log
    Parser            agentops_json
    Tag               agentops.logs
    Read_from_Head    On
    Refresh_Interval  5
    Skip_Long_Lines   On
    Mem_Buf_Limit     8MB

[OUTPUT]
    Name                 opensearch
    Match                *
    Host                 opensearch
    Port                 9200
    Index                agentops-d3-logs
    Suppress_Type_Name   On
    tls                  Off
    Replace_Dots         On
    Retry_Limit          5
    Trace_Error          On
