filebeat.inputs:
  - type: filestream
    id: agentops-jsonl
    enabled: true
    paths:
      - /var/log/agentops/*.jsonl
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true

setup.ilm.enabled: false
setup.template.enabled: false

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "agentops-logs"

logging.level: warning
