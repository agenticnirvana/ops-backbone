apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: mcp-ops-server
  namespace: design1
  tag: latest
  labels:
    design1.io/builtin: "true"
    design1.io/kind: "mcp_host"
    design1.io/mode: "mcp"
    design1.io/owner: "platform-team"
    design1.io/risk-tier: "medium"
    design1.io/status: "active"
