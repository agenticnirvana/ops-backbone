services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]

  mcp-server:
    build:
      context: ..
      dockerfile: platform/Dockerfile.mcp
    ports: ["8081:8081"]
    environment:
      MOCK_LLM: "true"

  gateway:
    build:
      context: ..
      dockerfile: platform/Dockerfile.gateway
    ports: ["8080:8080"]
    env_file: .env
    environment:
      MOCK_LLM: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on: [mlflow, mcp-server]
